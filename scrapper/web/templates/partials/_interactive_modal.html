<!-- Interactive Selection Modal -->
<div x-data="{ open: false, options: [], taskId: '', prompt: '' }"
     x-on:show-interactive-modal.window="open = true; options = $event.detail.options; taskId = $event.detail.taskId; prompt = $event.detail.prompt"
     x-show="open"
     x-cloak
     class="fixed inset-0 z-50 overflow-y-auto"
     aria-labelledby="modal-title" role="dialog" aria-modal="true">

    <!-- Background overlay -->
    <div class="flex min-h-screen items-center justify-center p-4">
        <div x-show="open"
             x-transition:enter="ease-out duration-300"
             x-transition:enter-start="opacity-0"
             x-transition:enter-end="opacity-100"
             x-transition:leave="ease-in duration-200"
             x-transition:leave-start="opacity-100"
             x-transition:leave-end="opacity-0"
             class="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity"
             @click="open = false">
        </div>

        <!-- Modal panel -->
        <div x-show="open"
             x-transition:enter="ease-out duration-300"
             x-transition:enter-start="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
             x-transition:enter-end="opacity-100 translate-y-0 sm:scale-100"
             x-transition:leave="ease-in duration-200"
             x-transition:leave-start="opacity-100 translate-y-0 sm:scale-100"
             x-transition:leave-end="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
             class="relative transform overflow-hidden rounded-lg bg-white shadow-xl transition-all sm:w-full sm:max-w-2xl">

            <div class="bg-white px-4 pb-4 pt-5 sm:p-6">
                <div class="sm:flex sm:items-start">
                    <div class="mx-auto flex h-12 w-12 flex-shrink-0 items-center justify-center rounded-full bg-blue-100 sm:mx-0 sm:h-10 sm:w-10">
                        <i data-lucide="help-circle" class="h-6 w-6 text-blue-600"></i>
                    </div>
                    <div class="mt-3 text-center sm:ml-4 sm:mt-0 sm:text-left flex-1">
                        <h3 class="text-lg font-semibold leading-6 text-gray-900" id="modal-title">
                            Select Match
                        </h3>
                        <p class="mt-2 text-sm text-gray-500" x-text="prompt"></p>
                    </div>
                </div>

                <!-- Options list -->
                <div class="mt-4 space-y-2 max-h-96 overflow-y-auto">
                    <template x-for="(option, index) in options" :key="index">
                        <div class="option-card border rounded-lg p-4 cursor-pointer hover:border-blue-500 hover:bg-blue-50"
                             @click="submitSelection(taskId, index + 1); open = false;">
                            <div class="flex items-center gap-4">
                                <img x-show="option.artwork_url" :src="option.artwork_url"
                                     class="w-16 h-16 rounded object-cover" alt="Cover">
                                <div class="flex-1">
                                    <div class="font-medium" x-text="option.title || option.name"></div>
                                    <div class="text-sm text-gray-500">
                                        <span x-text="option.artist"></span>
                                        <span x-show="option.year">(<span x-text="option.year"></span>)</span>
                                    </div>
                                    <div class="text-xs text-gray-400" x-text="option.type"></div>
                                </div>
                            </div>
                        </div>
                    </template>

                    <!-- Skip option -->
                    <div class="border border-dashed rounded-lg p-4 cursor-pointer hover:bg-gray-50 text-center"
                         @click="submitSelection(taskId, 0); open = false;">
                        <span class="text-gray-500">Skip this service</span>
                    </div>
                </div>
            </div>

            <div class="bg-gray-50 px-4 py-3 sm:flex sm:flex-row-reverse sm:px-6">
                <button type="button"
                        class="mt-3 inline-flex w-full justify-center rounded-md bg-white px-3 py-2 text-sm font-semibold text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 hover:bg-gray-50 sm:mt-0 sm:w-auto"
                        @click="open = false">
                    Cancel
                </button>
            </div>
        </div>
    </div>
</div>

<script>
async function submitSelection(taskId, selection) {
    try {
        const response = await fetch(`/api/v1/tasks/${taskId}/respond`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ selection })
        });
        if (response.ok) {
            showToast('Selection submitted', 'success');
        }
    } catch (error) {
        showToast('Failed to submit selection', 'error');
    }
}
</script>
