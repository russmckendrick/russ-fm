<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Performance optimization -->
    <link rel="preload" href="/collection.json" as="fetch" crossorigin="anonymous" />
    <link rel="dns-prefetch" href="https://assets.russ.fm" />
    <link rel="preconnect" href="https://assets.russ.fm" crossorigin />
    
    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    
    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    
    <!-- Android Chrome Icon -->
    <link rel="icon" type="image/png" sizes="512x512" href="/android-chrome-512x512.png" />
    
    <!-- Web App Manifest -->
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Default Meta Tags -->
    <meta name="description" content="Explore my personal vinyl and music collection. Browse albums, artists, and genres from my curated record collection." />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://russ.fm/" />
    <meta property="og:title" content="Russ.fm - Personal Record Collection" />
    <meta property="og:description" content="Explore my personal vinyl and music collection. Browse albums, artists, and genres from my curated record collection." />
    <meta property="og:image" content="https://russ.fm/og-image.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://russ.fm/" />
    <meta name="twitter:title" content="Russ.fm - Personal Record Collection" />
    <meta name="twitter:description" content="Explore my personal vinyl and music collection. Browse albums, artists, and genres from my curated record collection." />
    <meta name="twitter:image" content="https://russ.fm/og-image.png" />

    <title>Russ.fm - Personal Record Collection</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
