{% extends "base.html" %}

{% block content %}
<div x-data="{
    artist: null,
    loading: true,
    processing: false,
    error: null,

    async fetchArtist() {
        try {
            const response = await fetch('/api/v1/artists/{{ artist_name | urlencode }}');
            if (!response.ok) throw new Error('Artist not found');
            this.artist = await response.json();
        } catch (e) {
            this.error = e.message;
        }
        this.loading = false;
    },

    async processArtist(forceRefresh = false) {
        this.processing = true;
        try {
            const response = await fetch('/api/v1/artists/{{ artist_name | urlencode }}', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ force_refresh: forceRefresh, save: true })
            });
            const data = await response.json();
            showToast('Processing started. Task ID: ' + data.task_id, 'success');
        } catch (e) {
            showToast('Failed to start processing', 'error');
        }
        this.processing = false;
    }
}" x-init="fetchArtist()">

    <!-- Back button -->
    <div class="mb-6">
        <a href="/admin/artists" class="inline-flex items-center gap-2 text-gray-600 hover:text-gray-900">
            <i data-lucide="arrow-left" class="w-4 h-4"></i>
            Back to Artists
        </a>
    </div>

    <!-- Loading state -->
    <div x-show="loading" class="text-center py-12">
        <i data-lucide="loader-2" class="w-8 h-8 mx-auto text-blue-500 animate-spin"></i>
        <p class="mt-2 text-gray-500">Loading artist...</p>
    </div>

    <!-- Error state -->
    <div x-show="error" class="bg-red-50 border border-red-200 rounded-lg p-6 text-center">
        <i data-lucide="alert-circle" class="w-12 h-12 mx-auto text-red-400"></i>
        <p class="mt-2 text-red-700" x-text="error"></p>
    </div>

    <!-- Artist details -->
    <div x-show="!loading && artist">
        <div class="bg-white rounded-lg shadow overflow-hidden">
            <div class="md:flex">
                <!-- Artist image -->
                <div class="md:w-1/3">
                    <div class="aspect-square bg-gray-200 relative">
                        <img x-show="artist?.local_images?.['hi-res'] || artist?.local_images?.medium || artist?.local_images?.avatar"
                             :src="artist?.local_images?.['hi-res'] || artist?.local_images?.medium || artist?.local_images?.avatar"
                             :alt="artist?.name"
                             class="w-full h-full object-cover">
                        <div x-show="!artist?.local_images?.['hi-res'] && !artist?.local_images?.medium && !artist?.local_images?.avatar"
                             class="absolute inset-0 flex items-center justify-center text-gray-400">
                            <i data-lucide="user" class="w-24 h-24"></i>
                        </div>
                    </div>
                </div>

                <!-- Artist info -->
                <div class="md:w-2/3 p-6">
                    <div class="flex items-start justify-between">
                        <div>
                            <h1 class="text-2xl font-bold text-gray-900" x-text="artist?.name"></h1>
                        </div>
                        <div class="flex gap-2">
                            <button @click="processArtist(false)"
                                    :disabled="processing"
                                    class="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 disabled:opacity-50">
                                <span x-show="!processing">Enrich</span>
                                <span x-show="processing">Processing...</span>
                            </button>
                            <button @click="processArtist(true)"
                                    :disabled="processing"
                                    class="px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50 disabled:opacity-50">
                                Force Refresh
                            </button>
                        </div>
                    </div>

                    <!-- Biography -->
                    <div x-show="artist?.biography" class="mt-4">
                        <p class="text-gray-600 text-sm leading-relaxed" x-text="artist?.biography"></p>
                    </div>

                    <!-- Stats -->
                    <div class="mt-6 grid grid-cols-2 gap-4">
                        <div x-show="artist?.popularity">
                            <p class="text-sm text-gray-500">Popularity</p>
                            <p class="font-medium"><span x-text="artist?.popularity"></span>/100</p>
                        </div>
                        <div x-show="artist?.followers">
                            <p class="text-sm text-gray-500">Followers</p>
                            <p class="font-medium" x-text="artist?.followers?.toLocaleString()"></p>
                        </div>
                    </div>

                    <!-- Genres -->
                    <div x-show="artist?.genres?.length" class="mt-4">
                        <p class="text-sm text-gray-500 mb-2">Genres</p>
                        <div class="flex flex-wrap gap-2">
                            <template x-for="genre in artist?.genres" :key="genre">
                                <span class="px-2 py-1 bg-gray-100 rounded text-sm" x-text="genre"></span>
                            </template>
                        </div>
                    </div>

                    <!-- External Links -->
                    <div class="mt-6 flex flex-wrap gap-3">
                        <a x-show="artist?.discogs_url" :href="artist?.discogs_url" target="_blank"
                           class="inline-flex items-center gap-2 px-3 py-2 border rounded-lg hover:bg-gray-50">
                            <i data-lucide="external-link" class="w-4 h-4"></i>
                            Discogs
                        </a>
                        <a x-show="artist?.apple_music_url" :href="artist?.apple_music_url" target="_blank"
                           class="inline-flex items-center gap-2 px-3 py-2 border rounded-lg hover:bg-gray-50 text-pink-600">
                            <i data-lucide="apple" class="w-4 h-4"></i>
                            Apple Music
                        </a>
                        <a x-show="artist?.spotify_url" :href="artist?.spotify_url" target="_blank"
                           class="inline-flex items-center gap-2 px-3 py-2 border rounded-lg hover:bg-gray-50 text-green-600">
                            <i data-lucide="music" class="w-4 h-4"></i>
                            Spotify
                        </a>
                        <a x-show="artist?.lastfm_url" :href="artist?.lastfm_url" target="_blank"
                           class="inline-flex items-center gap-2 px-3 py-2 border rounded-lg hover:bg-gray-50 text-red-600">
                            <i data-lucide="radio" class="w-4 h-4"></i>
                            Last.fm
                        </a>
                        <a x-show="artist?.wikipedia_url" :href="artist?.wikipedia_url" target="_blank"
                           class="inline-flex items-center gap-2 px-3 py-2 border rounded-lg hover:bg-gray-50">
                            <i data-lucide="book-open" class="w-4 h-4"></i>
                            Wikipedia
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
