[package]
name = "discogs-sub"
version = "0.1.0"
edition = "2021"
description = "Draft Discogs release submissions for records not yet in the database"

[[bin]]
name = "discogs-sub"
path = "src/main.rs"

[dependencies]
# Reuse the scrapper's config discovery and Discogs / Apple Music clients.
scrapper = { path = "../scrapper" }

tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "query"] }
clap = { version = "4", features = ["derive"] }
dialoguer = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = "1"
chrono = "0.4"
regex = "1"
once_cell = "1"

[profile.release]
opt-level = 3
lto = "thin"
