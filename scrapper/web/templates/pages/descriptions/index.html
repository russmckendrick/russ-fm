{% extends "base.html" %}

{% block content %}
<div x-data="{
    missing: [],
    loading: true,
    processing: false,
    options: {
        batch_size: 50,
        force: false,
        dry_run: false
    },

    async fetchMissing() {
        this.loading = true;
        const response = await fetch('/api/v1/descriptions/missing?limit=100');
        const data = await response.json();
        this.missing = data.items;
        this.loading = false;
    },

    async enrichAll() {
        this.processing = true;
        try {
            const discogs_ids = this.missing.map(m => m.discogs_id);
            const response = await fetch('/api/v1/descriptions/enrich', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    discogs_ids: discogs_ids,
                    ...this.options
                })
            });
            const data = await response.json();
            showToast('Enrichment started. Task ID: ' + data.task_id, 'success');
            window.location.href = '/admin/tasks';
        } catch (e) {
            showToast('Failed to start enrichment', 'error');
        }
        this.processing = false;
    },

    async enrichSingle(discogs_id) {
        try {
            const response = await fetch('/api/v1/descriptions/enrich', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    discogs_ids: [discogs_id],
                    force: false,
                    dry_run: false
                })
            });
            const data = await response.json();
            showToast('Enrichment started. Task ID: ' + data.task_id, 'success');
        } catch (e) {
            showToast('Failed to start enrichment', 'error');
        }
    }
}" x-init="fetchMissing()">

    <!-- Header -->
    <div class="mb-8 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
        <div>
            <h1 class="text-2xl font-bold text-gray-900">Description Enrichment</h1>
            <p class="mt-1 text-gray-500">Generate AI descriptions for albums using Perplexity</p>
        </div>
    </div>

    <!-- Stats and Options -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-6">
        <!-- Stats Card -->
        <div class="bg-white rounded-lg shadow p-6">
            <h3 class="text-lg font-semibold text-gray-900 mb-4">Missing Descriptions</h3>
            <p class="text-4xl font-bold text-orange-500" x-text="missing.length"></p>
            <p class="text-sm text-gray-500 mt-1">albums without descriptions</p>
        </div>

        <!-- Options Card -->
        <div class="bg-white rounded-lg shadow p-6 lg:col-span-2">
            <h3 class="text-lg font-semibold text-gray-900 mb-4">Enrichment Options</h3>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Batch Size</label>
                    <input type="number" x-model.number="options.batch_size" min="1" max="100"
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                </div>

                <div class="flex items-center">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" x-model="options.force" class="rounded text-blue-500">
                        <span class="text-sm text-gray-700">Force regenerate</span>
                    </label>
                </div>

                <div class="flex items-center">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" x-model="options.dry_run" class="rounded text-blue-500">
                        <span class="text-sm text-gray-700">Dry run (preview)</span>
                    </label>
                </div>
            </div>

            <div class="mt-4 pt-4 border-t">
                <button @click="enrichAll()"
                        :disabled="processing || missing.length === 0"
                        class="px-6 py-2 bg-purple-500 text-white rounded-lg hover:bg-purple-600 disabled:opacity-50 font-medium">
                    <span x-show="!processing">Enrich All Missing</span>
                    <span x-show="processing">Starting...</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Loading state -->
    <div x-show="loading" class="text-center py-12">
        <i data-lucide="loader-2" class="w-8 h-8 mx-auto text-blue-500 animate-spin"></i>
        <p class="mt-2 text-gray-500">Loading albums...</p>
    </div>

    <!-- Albums missing descriptions -->
    <div x-show="!loading" class="bg-white rounded-lg shadow overflow-hidden">
        <div class="px-6 py-4 border-b flex items-center justify-between">
            <h2 class="text-lg font-semibold text-gray-900">Albums Missing Descriptions</h2>
            <button @click="fetchMissing()" class="text-sm text-blue-600 hover:text-blue-800">
                <i data-lucide="refresh-cw" class="w-4 h-4 inline mr-1"></i>
                Refresh
            </button>
        </div>

        <div x-show="missing.length === 0" class="p-12 text-center">
            <i data-lucide="check-circle" class="w-16 h-16 mx-auto text-green-300"></i>
            <p class="mt-4 text-gray-500">All albums have descriptions!</p>
        </div>

        <div x-show="missing.length > 0" class="divide-y">
            <template x-for="album in missing" :key="album.discogs_id">
                <div class="px-6 py-4 flex items-center gap-4 hover:bg-gray-50">
                    <div class="flex-1">
                        <p class="font-medium text-gray-900" x-text="album.title"></p>
                        <p class="text-sm text-gray-500" x-text="album.artists.join(', ')"></p>
                        <p class="text-xs text-gray-400 mt-1">
                            <span x-text="album.year || 'Unknown year'"></span>
                            <span class="mx-2">•</span>
                            <span x-text="album.discogs_id"></span>
                        </p>
                    </div>
                    <div class="flex items-center gap-2">
                        <a :href="'/admin/releases/' + album.discogs_id"
                           class="px-3 py-1.5 text-sm border rounded hover:bg-gray-50">
                            View
                        </a>
                        <button @click="enrichSingle(album.discogs_id)"
                                class="px-3 py-1.5 text-sm bg-purple-500 text-white rounded hover:bg-purple-600">
                            Enrich
                        </button>
                    </div>
                </div>
            </template>
        </div>
    </div>
</div>
{% endblock %}
