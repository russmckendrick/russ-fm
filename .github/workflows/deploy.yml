name: Deploy 🚀

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - 'project/**'
      - 'README.md'
      # Rust backend (scrapper/) is not part of the static-site build — it only writes public/.
      - 'scrapper/**'
  workflow_dispatch:
    inputs:
      targets:
        description: 'Re-upload these to R2 (comma-separated, e.g. album/<slug>,artist/<slug>). Overwrites existing objects.'
        required: false
        type: string

# One deploy at a time, in push order. A newer push waits for the running
# deploy rather than cancelling it part-way through an R2 sync or `wrangler
# deploy`, so an older build can never finish last and put the site back.
# GitHub keeps only the newest waiting run; the R2 sync compares dist/ with
# the bucket itself, so a push whose run was dropped still gets synced.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy 🚀
    permissions:
      contents: read
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v5

      - name: Setup Node.js 📦
        uses: actions/setup-node@v6
        with:
          node-version: 22.19.0

      - name: Install pnpm 🧊
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Get pnpm store directory 📂
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      # One blob holds the pnpm store plus the processed-image / OG cache.
      # actions/cache only saves when the primary key misses, so the key is
      # versioned: bump the `v` suffix to force a full regenerate + re-save.
      # Between bumps, images added since the blob was saved are cheap to
      # regenerate because the processor skips anything already in the cache.
      - name: Setup pnpm + assets cache 💾
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.STORE_PATH }}
            node_modules/.cache/assets
          key: ${{ runner.os }}-assets-v2-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('scripts/**', 'src/lib/imageProcessor.ts') }}
          restore-keys: |
            ${{ runner.os }}-assets-v2-
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies 🔧
        run: pnpm install

      - name: Generate Assets 🏗️
        run: |
          echo "🚀 Starting asset generation..."
          echo "🧹 Cleaning dist/..."
          rm -rf dist
          echo "📂 Ensuring cache directories exist..."
          mkdir -p node_modules/.cache/assets/images
          mkdir -p node_modules/.cache/assets/og

          echo "🗺️  Generating sitemap..."
          pnpm run generate-sitemap

          echo "🖼️  Processing images (cache-aware)..."
          pnpm run process-images -- --cache-dir node_modules/.cache/assets/images

          echo "🎨 Generating album colors..."
          pnpm run generate-colors

          echo "📊 Generating wrapped data..."
          pnpm run build:wrapped
          pnpm run generate-sitemap

          echo "📸 Generating OG images (cache-aware)..."
          pnpm run generate-og -- --cache-dir node_modules/.cache/assets/og

          # TV and genre cards go to public/og/ so the worker build ships them
          echo "📺 Generating TV and genre OG cards..."
          pnpm run generate-og-sections

          # Copy generic og-image.png to public/ so it's included in worker build
          echo "🖼️  Copying og-image.png to public/..."
          cp dist/og-image.png public/og-image.png
          echo "✅ Asset generation complete!"
        env:
          R2_PUBLIC_DOMAIN: ${{ secrets.R2_PUBLIC_DOMAIN }}

      # Normal runs list the bucket once and upload only images that are
      # missing from R2 or whose MD5 differs from the stored ETag, so the sync
      # never depends on git history (an old diff base used to re-upload all
      # ~20k images). A manual run with `targets` force-uploads exactly those
      # album/artist folders instead.
      - name: Sync to R2 ☁️
        env:
          TARGETS: ${{ inputs.targets }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_DOMAIN: ${{ secrets.R2_PUBLIC_DOMAIN }}
        run: |
          if [ -n "$TARGETS" ]; then
            echo "🎯 Manual targets: $TARGETS"
            echo "$TARGETS" | tr ',' '\n' | sed 's/^ *//; s/ *$//; s:/*$::' | grep . \
              | sed 's|^|public/|; s|$|/manual|' > changed_files.txt
            node scripts/sync-to-r2.js --force --concurrency 16 --changed-files changed_files.txt
          else
            node scripts/sync-to-r2.js --compare --concurrency 16
          fi

      # The app is type-checked and bundled exactly once, straight into
      # dist-worker (build-worker.js runs Vite itself). `pnpm run deploy` is
      # not used here because it would run tsc + Vite an extra time via build:fast.
      - name: Build Worker & Deploy to Cloudflare 🚀
        run: |
          echo "🔍 Type checking..."
          pnpm tsc --noEmit
          echo "🔨 Building worker bundle..."
          node scripts/build-worker.js
          echo "☁️  Deploying to Cloudflare Workers..."
          pnpm exec wrangler deploy
          echo "🎉 Deployed!"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_PUBLIC_DOMAIN: ${{ secrets.R2_PUBLIC_DOMAIN }}
          VITE_SCROBBLING_ENABLED: ${{ secrets.VITE_SCROBBLING_ENABLED }}

      - name: Job Summary 📝
        if: always()
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Status | Step |" >> $GITHUB_STEP_SUMMARY
          echo "| :---: | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| 🛎️ | **Checkout** |" >> $GITHUB_STEP_SUMMARY
          echo "| 💾 | **Cache Restore** |" >> $GITHUB_STEP_SUMMARY
          echo "| 🖼️ | **Images & Colours** |" >> $GITHUB_STEP_SUMMARY
          echo "| 📸 | **OG Images** |" >> $GITHUB_STEP_SUMMARY
          echo "| ☁️ | **R2 Sync** |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔍 | **Type Check** |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔨 | **Worker Build** |" >> $GITHUB_STEP_SUMMARY
          echo "| ⚡ | **Cloudflare Workers Deploy** |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🌐 Live Site" >> $GITHUB_STEP_SUMMARY
          echo "🎧 Visit [russ.fm](https://russ.fm) to see the changes! 🎶" >> $GITHUB_STEP_SUMMARY
