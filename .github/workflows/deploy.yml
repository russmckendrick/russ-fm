name: Deploy

on:
  push:
    branches:
      - main

jobs:
jobs:
  assets:
    runs-on: ubuntu-latest
    name: Generate Assets 🖼️
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node.js 📦
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm 🧊
        uses: pnpm/action-setup@v3
        with:
          version: 10
          run_install: false

      - name: Get pnpm store directory 📂
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache 💾
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.STORE_PATH }}
            node_modules/.cache/assets
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('scripts/**') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies 🔧
        run: pnpm install

      - name: Generate Assets 🏗️
        run: |
          echo "🚀 Starting asset generation..."
          
          # Create cache dirs
          echo "📂 Ensuring cache directories exist..."
          mkdir -p node_modules/.cache/assets/images
          mkdir -p node_modules/.cache/assets/og
          
          # Process images with cache
          echo "🖼️  Processing images (filling cache)..."
          pnpm run process-images -- --cache-dir node_modules/.cache/assets/images
          
          # Generate colors (automatically treats public/album-colors.json as cache)
          echo "🎨 Generating album colors..."
          pnpm run generate-colors
          
          # Generate OG images with cache
          echo "📸 Generating OG images (filling cache)..."
          pnpm run generate-og -- --cache-dir node_modules/.cache/assets/og

  deploy:
    needs: assets
    runs-on: ubuntu-latest
    name: Build & Deploy 🚀
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 📦
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm 🧊
        uses: pnpm/action-setup@v3
        with:
          version: 10
          run_install: false

      - name: Get pnpm store directory 📂
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache 💾
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.STORE_PATH }}
            node_modules/.cache/assets
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('scripts/**') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies 🔧
        run: pnpm install

      - name: Build and Prepare 🏗️
        run: |
          echo "🚀 Starting build process..."
          
          # Build application (JS/TS)
          echo "🔨 Compiling application..."
          rm -rf dist
          pnpm tsc --noEmit
          pnpm vite build
          
          # Re-run generation steps to populate dist from cache
          echo "📦 Populating dist from cache..."
          pnpm run process-images -- --cache-dir node_modules/.cache/assets/images
          pnpm run generate-colors
          pnpm run generate-og -- --cache-dir node_modules/.cache/assets/og
        env:
          R2_PUBLIC_DOMAIN: ${{ secrets.R2_PUBLIC_DOMAIN }}
          VITE_SCROBBLING_ENABLED: ${{ secrets.VITE_SCROBBLING_ENABLED }}

      - name: Detect Changed Files 🕵️‍♂️
        id: changed-files
        run: |
          git diff --name-only ${{ github.event.before }} ${{ github.sha }} > changed_files.txt
          echo "Changed files:"
          cat changed_files.txt

      - name: Sync to R2 ☁️
        run: node scripts/sync-to-r2.js --force --changed-files changed_files.txt
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_DOMAIN: ${{ secrets.R2_PUBLIC_DOMAIN }}

      - name: Deploy to Cloudflare Workers 🚀
        run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_PUBLIC_DOMAIN: ${{ secrets.R2_PUBLIC_DOMAIN }}

      - name: Job Summary 📝
        if: always()
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Status | Step |" >> $GITHUB_STEP_SUMMARY
          echo "| :---: | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| ✅ | **Asset Generation** |" >> $GITHUB_STEP_SUMMARY
          echo "| 💾 | **Cache Saved** |" >> $GITHUB_STEP_SUMMARY
          echo "| 🏗️ | **Build & Populate** |" >> $GITHUB_STEP_SUMMARY
          echo "| ☁️ | **R2 Sync** |" >> $GITHUB_STEP_SUMMARY
          echo "| ⚡ | **Cloudflare Workers** |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🌐 Live Site" >> $GITHUB_STEP_SUMMARY
          echo "Visit [russ.fm](https://russ.fm) to see the changes!" >> $GITHUB_STEP_SUMMARY
