[package]
name = "scrapper"
version = "0.1.0"
edition = "2021"
description = "Music collection enrichment — a cohesive Rust TUI/CLI (rewrite of the Python scrapper)"
default-run = "scrapper"

[[bin]]
name = "scrapper"
path = "src/main.rs"

[lib]
name = "scrapper"
path = "src/lib.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# HTTP
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }

# CLI / TUI
clap = { version = "4", features = ["derive"] }
ratatui = "0.29"
crossterm = "0.28"
dialoguer = "0.11"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

# Database
rusqlite = { version = "0.32", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"

# Auth / crypto
jsonwebtoken = "9"
md-5 = "0.10"
hex = "0.4"

# Rate limiting
governor = "0.7"
nonzero_ext = "0.3"

# Images
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Utilities
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
once_cell = "1"
regex = "1"
urlencoding = "2"

[dev-dependencies]
tempfile = "3"
unicode-normalization = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
